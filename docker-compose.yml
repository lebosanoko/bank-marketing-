services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      POSTGRES_DB: ${POSTGRES_DB:-bank_marketing}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bank} -d ${POSTGRES_DB:-bank_marketing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build: .
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "postgresql+psycopg2://${POSTGRES_USER:-bank}:${POSTGRES_PASSWORD:-bank}@postgres:5432/${POSTGRES_DB:-bank_marketing}", "--default-artifact-root", "/mlartifacts"]
    ports: ["5000:5000"]
    volumes: ["mlflow_artifacts:/mlartifacts"]
    depends_on:
      postgres: { condition: service_healthy }

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: ["airflow", "db", "migrate"]
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-bank}:${POSTGRES_PASSWORD:-bank}@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: local-development-secret
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__CORE__FERNET_KEY: ""
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bank}:${POSTGRES_PASSWORD:-bank}@postgres:5432/${POSTGRES_DB:-bank_marketing}
      MODEL_PATH: /app/models/model.pkl
      PYTHONPATH: /opt/airflow
    depends_on:
      postgres: { condition: service_healthy }
      mlflow: { condition: service_started }
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./bank:/app/bank:ro
      - ./src:/opt/airflow/src:ro
      - model_data:/app/models

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: ["airflow", "standalone"]
    environment:
      <<: *airflow-env
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    ports: ["8080:8080"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./bank:/app/bank:ro
      - ./src:/opt/airflow/src:ro
      - model_data:/app/models

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MODEL_PATH: /app/models/model.pkl
      MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
      PYTHONPATH: /app
    ports: ["${API_HOST_PORT:-8000}:8000"]
    volumes:
      - model_data:/app/models:ro
      - ./api:/app/api:ro
      - ./src:/app/src:ro
    depends_on:
      mlflow: { condition: service_started }

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
      API_DOCS_URL: http://localhost:${API_HOST_PORT:-8000}/docs
    ports: ["8501:8501"]
    volumes:
      - ./dashboard:/app/dashboard:ro
    depends_on: [api]

volumes:
  postgres_data:
  mlflow_artifacts:
  model_data:
